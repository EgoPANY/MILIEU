# MILIEU research release · conda env (certificate baseline)
name: milieu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - scanpy>=1.9
  - anndata>=0.10
  - pytorch>=2.2
  - pip:
      - -e ".[dev]"
